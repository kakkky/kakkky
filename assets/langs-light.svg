<svg xmlns="http://www.w3.org/2000/svg" width="350" height="230" viewBox="0 0 350 230" role="img" aria-label="Most Used Languages">
<style>
.t{font:600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#1f2328}
.l{font:13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#57606a}
.v{font:600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#1f2328}
.row{opacity:0;animation:in .5s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.bar{clip-path:inset(0 100% 0 0 round 5px);animation:grow 1.2s cubic-bezier(.2,.8,.2,1) .2s forwards}@keyframes grow{to{clip-path:inset(0 0 0 0 round 5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<rect x="0.5" y="0.5" width="349" height="229" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text class="t" x="24" y="36">Most Used Languages</text>
<g class="bar"><rect x="24.0" y="52" width="195.6" height="10" fill="#00ADD8"/><rect x="219.6" y="52" width="43.2" height="10" fill="#3178c6"/><rect x="262.8" y="52" width="38.1" height="10" fill="#701516"/><rect x="300.9" y="52" width="14.1" height="10" fill="#e34c26"/><rect x="315.0" y="52" width="6.5" height="10" fill="#a91e50"/><rect x="321.5" y="52" width="4.5" height="10" fill="#f1e05a"/></g><g class="row" style="animation-delay:0.50s"><circle cx="30" cy="88" r="5" fill="#00ADD8"/><text class="l" x="42" y="92">Go <tspan class="v" style="font-weight:400">64.8%</tspan></text></g><g class="row" style="animation-delay:0.60s"><circle cx="180" cy="88" r="5" fill="#3178c6"/><text class="l" x="192" y="92">TypeScript <tspan class="v" style="font-weight:400">14.3%</tspan></text></g><g class="row" style="animation-delay:0.70s"><circle cx="30" cy="114" r="5" fill="#701516"/><text class="l" x="42" y="118">Ruby <tspan class="v" style="font-weight:400">12.6%</tspan></text></g><g class="row" style="animation-delay:0.80s"><circle cx="180" cy="114" r="5" fill="#e34c26"/><text class="l" x="192" y="118">HTML <tspan class="v" style="font-weight:400">4.7%</tspan></text></g><g class="row" style="animation-delay:0.90s"><circle cx="30" cy="140" r="5" fill="#a91e50"/><text class="l" x="42" y="144">EJS <tspan class="v" style="font-weight:400">2.2%</tspan></text></g><g class="row" style="animation-delay:1.00s"><circle cx="180" cy="140" r="5" fill="#f1e05a"/><text class="l" x="192" y="144">JavaScript <tspan class="v" style="font-weight:400">1.5%</tspan></text></g>
</svg>
